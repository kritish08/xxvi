[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xxvi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    # Already pulled in transitively via starlette/fastapi, but
    # xxvi/api/ws_routes.py now imports it directly (CancelScope(shield=True)
    # around the disconnect-recording cleanup -- see that module for why),
    # so it is a direct dependency of this package now, not just an
    # implicit one of a dependency.
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "pg: Postgres integration test against a real database (needs PG_TEST_URL; see tests/integration/README.md). Skipped cleanly when PG_TEST_URL is unset.",
]

[tool.setuptools.packages.find]
include = ["xxvi*"]
